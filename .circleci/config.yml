version: 2.1

orbs:
  # Snyk-owned orbs: track the latest release of the major version
  prodsec: snyk/prodsec-orb@1
  # Third-party orbs: always pin an exact version
  win: circleci/windows@5.1.1

defaults: &defaults
  parameters:
    maven_version:
      type: string
      default: ''
    jdk_version:
      type: string
      default: '8'
    node_version:
      type: string
      default: '22'
  working_directory: ~/snyk-mvn-plugin

windows_defaults: &windows_defaults
  environment:
    npm_config_loglevel: silent
  executor:
    # win/default moved to Windows Server 2022 in orb v5, where the invalid-XML system test fails with Maven 3.6.3/3.9.11
    name: win/server-2019

osx_defaults: &osx_defaults
  macos:
    xcode: 16.4.0

test_matrix_unix: &test_matrix_unix
  jdk_version: ['8.0.342-amzn', '17.0.4.1.fx-librca', '21.0.8.fx-librca']
  maven_version: ['3.3.9', '3.6.3', '3.9.11']
  node_version: ['22', '24', '26']

test_matrix_win: &test_matrix_win
  jdk_version: ['8', '17', '21']
  maven_version: ['3.3.9', '3.6.3', '3.9.11']
  node_version: ['22', '24', '26']

test_matrix_os: &test_matrix_osx
  jdk_version: ['8.0.342-amzn', '17.0.4.1.fx-librca', '21.0.8.fx-librca']
  maven_version: ['3.3.9', '3.6.3', '3.9.11']
  node_version: ['22', '24', '26']

# Maven 4 matrices (requires Java 17+)
test_matrix_maven4_unix: &test_matrix_maven4_unix
  jdk_version: ['17.0.4.1.fx-librca', '21.0.8.fx-librca']
  maven_version: ['4.0.0-rc-4']
  node_version: ['22', '24', '26']

commands:
  install_deps:
    description: Install dependencies
    steps:
      - run:
          name: Install dependencies
          command: npm ci

  install_node_npm:
    description: Install correct Node version
    parameters:
      node_version:
        type: string
        default: ''
    steps:
      - run:
          name: Install correct version of Node
          command: nvm install << parameters.node_version >>
      - run:
          name: Use correct version of Node
          command: nvm use << parameters.node_version >>

  install_node_npm_osx:
    description: Install matrix Node version on macOS (nvm; persists via BASH_ENV)
    parameters:
      node_version:
        type: string
        default: ''
    steps:
      - run:
          name: Install Node << parameters.node_version >> (macOS / nvm)
          command: |
            set -euo pipefail
            export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
            if [ ! -s "$NVM_DIR/nvm.sh" ]; then
              curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
            fi
            . "$NVM_DIR/nvm.sh"
            nvm install << parameters.node_version >>
            nvm alias default << parameters.node_version >>
            nvm use << parameters.node_version >>
            {
              echo 'export NVM_DIR="$HOME/.nvm"'
              echo '[ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"'
              echo "nvm use << parameters.node_version >> >/dev/null"
            } >> "$BASH_ENV"

  show_node_version:
    description: Log Node and npm version
    steps:
      - run:
          name: Node version
          command: node --version
      - run:
          name: NPM version
          command: npm --version

  install_sdkman:
    description: Install SDKMAN
    steps:
      - run:
          name: Installing SDKMAN
          command: curl -s "https://get.sdkman.io?rcupdate=false" | bash
      - run:
          name: Sourcing SDKMAN
          command: |
            echo -e '\nsource ~/.sdkman/bin/sdkman-init.sh' >> $BASH_ENV
            source $BASH_ENV

  install_jdk_unix:
    description: Install JDK
    parameters:
      jdk_version:
        type: string
        default: ''
    steps:
      - run:
          name: Installing JDK
          command: sdk install java << parameters.jdk_version >>

  install_jdk_windows:
    description: Install JDK
    parameters:
      jdk_version:
        type: string
        default: ''
    steps:
      - run:
          name: Installing JDK << parameters.jdk_version >>
          command: |
            $ErrorActionPreference = 'Stop'
            switch ('<< parameters.jdk_version >>') {
              '8'  { $url = 'https://github.com/adoptium/temurin8-binaries/releases/download/jdk8u512-b09/OpenJDK8U-jdk_x64_windows_hotspot_8u512b09.zip'; $sha256 = '20f248ddd600f900cd9b235d50d54cdb27e7b750f140d381176a7612c53663cd' }
              '17' { $url = 'https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.21.1%2B2/OpenJDK17U-jdk_x64_windows_hotspot_17.0.21.1_2.zip'; $sha256 = 'eafba0944f777abdc74d5aad16049c9b5a1275b6ce99e2939ba9f7f3e6f08c87' }
              '21' { $url = 'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.13.1%2B2/OpenJDK21U-jdk_x64_windows_hotspot_21.0.13.1_2.zip'; $sha256 = 'bbebea1469996b276683c9299c227b294f85c847039c82633218186a4ad4fbf2' }
              default { throw "No pinned Temurin JDK for jdk_version '<< parameters.jdk_version >>'" }
            }
            $zip = "$env:TEMP\jdk.zip"
            # schannel fails the TLS handshake (exit 35, not retried) when a revocation server is unreachable; the pinned hash still guards integrity
            curl.exe -fSL --ssl-revoke-best-effort --retry 3 --connect-timeout 30 --max-time 600 -o $zip $url
            if ($LASTEXITCODE -ne 0) { throw "curl.exe exited with $LASTEXITCODE" }
            if ((Get-FileHash -Algorithm SHA256 $zip).Hash -ne $sha256) { throw "SHA-256 mismatch for $url" }
            New-Item -ItemType Directory -Path C:\jdk | Out-Null
            tar.exe -xf $zip -C C:\jdk --strip-components 1
            if ($LASTEXITCODE -ne 0) { throw "tar.exe exited with $LASTEXITCODE" }
            C:\jdk\bin\java.exe -version
            if ($LASTEXITCODE -ne 0) { throw "java.exe -version exited with $LASTEXITCODE" }

  install_maven_unix:
    description: Install maven
    parameters:
      maven_version:
        type: string
        default: ''
    steps:
      - run:
          name: Installing Maven
          command: sdk install maven << parameters.maven_version >>

  install_maven_osx:
    description: Install maven and route Maven Central through Google's mirror; repo.maven.apache.org rate-limits (429) the shared macOS runner IPs
    parameters:
      maven_version:
        type: string
        default: ''
    steps:
      - run:
          name: Installing Maven
          command: |
            v=<< parameters.maven_version >>
            curl -fsSL --retry 3 -o "/tmp/apache-maven-$v-bin.zip" \
              "https://maven-central.storage-download.googleapis.com/maven2/org/apache/maven/apache-maven/$v/apache-maven-$v-bin.zip"
            unzip -q "/tmp/apache-maven-$v-bin.zip" -d "$HOME/maven"
            echo "export PATH=\"$HOME/maven/apache-maven-$v/bin:\$PATH\"" >> "$BASH_ENV"
            source "$BASH_ENV"
            mvn -v
      - run:
          name: Configuring Maven Central mirror
          command: |
            mkdir -p ~/.m2
            printf '%s\n' \
              '<settings>' \
              '  <mirrors>' \
              '    <mirror>' \
              '      <id>google-maven-central</id>' \
              '      <mirrorOf>central</mirrorOf>' \
              '      <url>https://maven-central.storage-download.googleapis.com/maven2/</url>' \
              '    </mirror>' \
              '  </mirrors>' \
              '</settings>' > ~/.m2/settings.xml

  install_maven_windows:
    description: Install maven
    parameters:
      maven_version:
        type: string
        default: ''
    steps:
      - run:
          name: Installing Maven << parameters.maven_version >>
          command: |
            $ErrorActionPreference = 'Stop'
            switch ('<< parameters.maven_version >>') {
              '3.3.9'  { $sha512 = '6e3aeed4c3c2beb736b2796a3a15f5395e68286d078868636644b6d80b7f20b9b084ec9965d2a56d2e289a8abafb11f415aceb011cd1cb12e7a1611becd8114c' }
              '3.6.3'  { $sha512 = '1c095ed556eda06c6d82fdf52200bc4f3437a1bab42387e801d6f4c56e833fb82b16e8bf0aab95c9708de7bfb55ec27f653a7cf0f491acebc541af234eded94d' }
              '3.9.11' { $sha512 = '03e2d65d4483a3396980629f260e25cac0d8b6f7f2791e4dc20bc83f9514db8d0f05b0479e699a5f34679250c49c8e52e961262ded468a20de0be254d8207076' }
              default  { throw "No pinned Maven for maven_version '<< parameters.maven_version >>'" }
            }
            $url = 'https://archive.apache.org/dist/maven/maven-3/<< parameters.maven_version >>/binaries/apache-maven-<< parameters.maven_version >>-bin.zip'
            $zip = "$env:TEMP\maven.zip"
            # schannel fails the TLS handshake (exit 35, not retried) when a revocation server is unreachable; the pinned hash still guards integrity
            curl.exe -fSL --ssl-revoke-best-effort --retry 3 --connect-timeout 30 --max-time 600 -o $zip $url
            if ($LASTEXITCODE -ne 0) { throw "curl.exe exited with $LASTEXITCODE" }
            if ((Get-FileHash -Algorithm SHA512 $zip).Hash -ne $sha512) { throw "SHA-512 mismatch for $url" }
            New-Item -ItemType Directory -Path C:\maven | Out-Null
            tar.exe -xf $zip -C C:\maven --strip-components 1
            if ($LASTEXITCODE -ne 0) { throw "tar.exe exited with $LASTEXITCODE" }

jobs:
  security-scans:
    resource_class: small
    <<: *defaults
    docker:
      - image: cimg/node:<< parameters.node_version >>
    steps:
      - checkout
      - install_deps
      - show_node_version
      - prodsec/security_scans:
          mode: auto
          release-branch: master
          open-source-additional-arguments: --exclude=tests
          iac-scan: disabled

  lint:
    <<: *defaults
    docker:
      - image: cimg/node:<< parameters.node_version >>
    steps:
      - checkout
      - install_deps
      - show_node_version
      - run:
          name: Run lint
          command: npm run lint

  test-windows:
    <<: *defaults
    <<: *windows_defaults
    steps:
      - run: git config --global core.autocrlf false
      - checkout
      - install_node_npm:
          node_version: << parameters.node_version >>
      - install_jdk_windows:
          jdk_version: << parameters.jdk_version >>
      - install_maven_windows:
          maven_version: << parameters.maven_version >>
      - install_deps
      - show_node_version
      - run:
          name: Run tests
          command: |
            $ErrorActionPreference = 'Stop'
            # a machine-level JAVA_HOME (as choco's jdk8 set) overrides job environment, so the checks compare against literal install directories
            $jdk = 'C:\jdk'
            $maven = 'C:\maven'
            $env:JAVA_HOME = $jdk
            $env:Path = "$jdk\bin;$maven\bin;$env:Path"
            if ((Get-Command java).Source -ne "$jdk\bin\java.exe") { throw "java resolves to $((Get-Command java).Source), not $jdk" }
            java -version
            if ($LASTEXITCODE -ne 0) { throw "java -version exited with $LASTEXITCODE" }
            $mvnVersion = mvn -v | Out-String
            if ($LASTEXITCODE -ne 0) { throw "mvn -v exited with $LASTEXITCODE" }
            Write-Output $mvnVersion
            if ($mvnVersion -notmatch "Apache Maven $([regex]::Escape('<< parameters.maven_version >>')) ") { throw "mvn is not Maven << parameters.maven_version >>" }
            if ($mvnVersion -notmatch "Maven home: $([regex]::Escape($maven))\r?\n") { throw "mvn is not running from $maven" }
            if ($mvnVersion -notmatch "(Java home|runtime): $([regex]::Escape($jdk))(\\jre)?\r?\n") { throw "mvn is not running on the JDK in $jdk" }
            npm run test:maven3

  test-unix:
    <<: *defaults
    docker:
      - image: cimg/node:<< parameters.node_version >>
    environment:
      MAVEN_VERSION: << parameters.maven_version >>
      JDK: << parameters.jdk_version >>
    steps:
      - checkout
      - install_sdkman
      - install_jdk_unix:
          jdk_version: << parameters.jdk_version >>
      - install_maven_unix:
          maven_version: << parameters.maven_version >>
      - install_deps
      - show_node_version
      - run:
          name: Run tests
          command: npm run test:maven3

  test-unix-maven4:
    <<: *defaults
    docker:
      - image: cimg/node:<< parameters.node_version >>
    environment:
      MAVEN_VERSION: << parameters.maven_version >>
      JDK: << parameters.jdk_version >>
    steps:
      - checkout
      - install_sdkman
      - install_jdk_unix:
          jdk_version: << parameters.jdk_version >>
      - install_maven_unix:
          maven_version: << parameters.maven_version >>
      - install_deps
      - show_node_version
      - run:
          name: Run tests
          command: npm run test:maven4

  test-osx:
    <<: *defaults
    <<: *osx_defaults
    environment:
      MAVEN_VERSION: << parameters.maven_version >>
      JDK: << parameters.jdk_version >>
    steps:
      - checkout
      - run:
          name: Update bash for macOS
          command: |
            brew install bash
            echo 'export PATH="$(brew --prefix bash)/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            which bash
            bash --version
      - install_node_npm_osx:
          node_version: << parameters.node_version >>
      - install_sdkman
      - install_jdk_unix:
          jdk_version: << parameters.jdk_version >>
      - install_maven_osx:
          maven_version: << parameters.maven_version >>
      - install_deps
      - show_node_version
      - run:
          name: Run tests
          command: npm run test:maven3

  test-osx-maven4:
    <<: *defaults
    <<: *osx_defaults
    environment:
      MAVEN_VERSION: << parameters.maven_version >>
      JDK: << parameters.jdk_version >>
    steps:
      - checkout
      - run:
          name: Update bash for macOS
          command: |
            brew install bash
            echo 'export PATH="$(brew --prefix bash)/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            which bash
            bash --version
      - install_node_npm_osx:
          node_version: << parameters.node_version >>
      - install_sdkman
      - install_jdk_unix:
          jdk_version: << parameters.jdk_version >>
      - install_maven_osx:
          maven_version: << parameters.maven_version >>
      - install_deps
      - show_node_version
      - run:
          name: Run tests
          command: npm run test:maven4

  release:
    <<: *defaults
    docker:
      - image: node:24  # npm 11+ (Node 24) is needed for OIDC trusted publishing
    steps:
      - checkout
      - install_deps
      - run:
          name: Publish to GitHub
          command: |
            export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')
            npx semantic-release

workflows:
  version: 2
  test_and_release:
    jobs:
      - prodsec/secrets-scan:
          name: Scan repository for secrets
          context:
            - snyk-bot-slack
            - prodsec-orb-runtime
          channel: snyk-vuln-alerts-sca-scanners
          filters:
            branches:
              ignore:
                - master

      - security-scans:
          name: Security Scans
          node_version: "24"
          context:
            - engines_sca-scanners
            - nodejs-install
            - prodsec-orb-runtime

      - lint:
          name: Lint
          context: nodejs-install
          node_version: '24'
          filters:
            branches:
              ignore:
                - master

      # UNIX tests
      - test-unix:
          requires:
            - Lint
            - Security Scans
          matrix:
            alias: test-unix
            parameters:
              <<: *test_matrix_unix
          name: Unix Tests for Maven=<< matrix.maven_version >> JDK=<< matrix.jdk_version >> Node=<< matrix.node_version >>
          context: nodejs-install

      # Windows tests
      - test-windows:
          requires:
            - Lint
            - Security Scans
          matrix:
            alias: test-windows
            parameters:
              <<: *test_matrix_win
          name: Windows Tests for Maven=<< matrix.maven_version >> JDK=<< matrix.jdk_version >> Node=<< matrix.node_version >>
          context: nodejs-install

      # OSX tests
      - test-osx:
          requires:
            - Lint
            - Security Scans
          matrix:
            alias: test-osx
            parameters:
              <<: *test_matrix_osx
          name: OSX Tests for Maven=<< matrix.maven_version >> JDK=<< matrix.jdk_version >> Node=<< matrix.node_version >>
          context: nodejs-install

      # Maven 4 tests (Unix)
      - test-unix-maven4:
          requires:
            - Lint
            - Security Scans
          matrix:
            parameters:
              <<: *test_matrix_maven4_unix
          name: Unix Tests for Maven=<< matrix.maven_version >> JDK=<< matrix.jdk_version >> Node=<< matrix.node_version >>
          context: nodejs-install

      # Maven 4 tests (OSX)
      - test-osx-maven4:
          requires:
            - Lint
            - Security Scans
          matrix:
            parameters:
              <<: *test_matrix_maven4_unix
          name: OSX Tests for Maven=<< matrix.maven_version >> JDK=<< matrix.jdk_version >> Node=<< matrix.node_version >>
          context: nodejs-install

      # Release
      - release:
          name: Release
          context:
            - nodejs-install
            - github-release
          requires:
            - test-osx
            - test-windows
            - test-unix
            - test-unix-maven4
            - test-osx-maven4
          filters:
            branches:
              only:
                - master
